<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5CFF"/>
      <stop offset="1" stop-color="#1B1F3B"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8BFFD6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- squircle body: 824px centered, 100px margin, radius ~185 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>

  <!-- waveform fading into silence: bold rounded bars, tall -> short -->
  <g fill="url(#mark)" stroke="none">
    <rect x="236" y="432" width="66" height="160" rx="33"/>
    <rect x="338" y="332" width="66" height="360" rx="33"/>
    <rect x="440" y="252" width="66" height="520" rx="33"/>
    <rect x="542" y="372" width="66" height="280" rx="33"/>
    <rect x="644" y="452" width="66" height="120" rx="33" opacity="0.9"/>
  </g>

  <!-- trailing dots fading into silence -->
  <g fill="#8BFFD6">
    <circle cx="762" cy="512" r="26" opacity="0.6"/>
    <circle cx="840" cy="512" r="18" opacity="0.32"/>
  </g>
</svg>
