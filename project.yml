name: Subvox
options:
  bundleIdPrefix: com.aayu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Subvox:
    type: application
    platform: macOS
    sources: [Subvox]
    info:
      path: Subvox/Info.plist
      properties:
        CFBundleDisplayName: Subvox
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMotionUsageDescription: Subvox reads AirPods head-motion data to study whether mouthed words can be decoded into text.
        NSMicrophoneUsageDescription: Subvox records microphone audio alongside motion data and transcribes whispered speech for comparison.
        NSSpeechRecognitionUsageDescription: Subvox transcribes microphone audio on-device as a reference for the motion decoder.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aayu.subvox
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SubvoxTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SubvoxTests]
    dependencies:
      - target: Subvox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aayu.subvox.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Subvox:
    build:
      targets:
        Subvox: all
        SubvoxTests: [test]
    test:
      targets: [SubvoxTests]
